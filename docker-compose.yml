version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: khaliderp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: khaliderp
      POSTGRES_PASSWORD: khaliderp_secret
      POSTGRES_DB: khaliderp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U khaliderp']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: khaliderp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@khaliderp.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
